{% extends "base.html" %}

{% block title %}Error - Sistem Pencatatan Panen Bawang Merah{% endblock %}

{% block extra_css %}
<style>
    .error-container {
        text-align: center;
        padding: 60px 20px;
    }
    
    .error-icon {
        font-size: 64px;
        color: #dc3545;
        margin-bottom: 20px;
    }
    
    .error-text {
        font-size: 18px;
        margin-bottom: 30px;
    }
</style>
{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-icon">
        <i class="fas fa-exclamation-triangle"></i>
    </div>
    
    <h1 class="h2 mb-3">Terjadi Kesalahan</h1>
    
    <p class="error-text text-muted">
        {{ pesan }}
    </p>
    
    <div>
        <a href="/" class="btn btn-primary btn-lg">
            <i class="fas fa-home"></i> Kembali ke Dashboard
        </a>
    </div>
</div>
{% endblock %}
