<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Dokumen Desa - Desa Kalajena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        
        .navbar {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }
        
        .navbar-brand {
            font-weight: 700;
            color: white !important;
        }
        
        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            margin-bottom: 40px;
        }
        
        /* ============================================================
           DOCUMENT CARD GRID
           ============================================================ */
        
        .dokumen-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .dokumen-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        
        .dokumen-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }
        
        .dokumen-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px 20px;
            text-align: center;
            color: white;
        }
        
        .dokumen-icon {
            font-size: 3em;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        
        .dokumen-type {
            display: inline-block;
            background: rgba(255, 255, 255, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }
        
        .dokumen-body {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .dokumen-nama {
            font-size: 1.2em;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        
        .dokumen-tahun {
            display: inline-block;
            background: #ffc107;
            color: #333;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .dokumen-info {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 8px;
        }
        
        .dokumen-deskripsi {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 15px;
            flex-grow: 1;
            line-height: 1.5;
        }
        
        .dokumen-stats {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            margin-bottom: 12px;
            font-size: 0.85em;
            color: #666;
        }
        
        .dokumen-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn-download {
            flex: 1;
            background: #25d366;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .btn-download:hover {
            background: #1ea755;
            transform: scale(1.05);
        }
        
        .btn-preview {
            flex: 1;
            background: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .btn-preview:hover {
            background: #0056b3;
            transform: scale(1.05);
        }
        
        /* ============================================================
           FILTER SECTION
           ============================================================ */
        
        .filter-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .filter-section h5 {
            color: #1e3c72;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        /* ============================================================
           EMPTY STATE
           ============================================================ */
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .empty-state-icon {
            font-size: 4em;
            color: #ccc;
            margin-bottom: 20px;
        }
        
        .empty-state-text {
            color: #999;
            font-size: 1.1em;
        }
        
        /* ============================================================
           RESPONSIVE
           ============================================================ */
        
        @media (max-width: 768px) {
            .dokumen-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 15px;
            }
            
            .dokumen-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-landmark"></i> Desa Kalajena
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="dokumen.html">Dokumen</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="page-header">
        <h1 style="margin-bottom: 0;">
            <i class="fas fa-file-pdf"></i> Dokumen Resmi Desa
        </h1>
        <p style="margin-top: 10px; opacity: 0.95;">APBDes, RKPDes, dan dokumen penting lainnya</p>
    </section>

    <!-- Main Content -->
    <div class="container" style="margin-top: -30px; margin-bottom: 40px;">
        <!-- Filter Section -->
        <div class="filter-section">
            <h5><i class="fas fa-filter"></i> Filter Dokumen</h5>
            <form method="GET" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Jenis Dokumen</label>
                    <select class="form-select" name="tipe" id="filterTipe">
                        <option value="">Semua Jenis</option>
                        <option value="APBDes">APBDes</option>
                        <option value="RKPDes">RKPDes</option>
                        <option value="Keputusan Desa">Keputusan Desa</option>
                        <option value="Peraturan Desa">Peraturan Desa</option>
                        <option value="Laporan Keuangan">Laporan Keuangan</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Tahun</label>
                    <select class="form-select" name="tahun" id="filterTahun">
                        <option value="">Semua Tahun</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">&nbsp;</label>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-search"></i> Cari Dokumen
                    </button>
                </div>
            </form>
        </div>

        <!-- Documents Grid -->
        <div id="dokumenContainer">
            <!-- Grid akan di-load dari JavaScript -->
            <div class="text-center py-5">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3">Memuat dokumen...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        /**
         * Script untuk load dan menampilkan dokumen desa
         */
        
        // Data dokumen contoh (dalam implementasi nyata, ini dari server)
        const dummyDokumen = [
            {
                id: 1,
                nama_dokumen: 'APBDes Tahun 2024',
                tipe_dokumen: 'APBDes',
                tahun: 2024,
                deskripsi: 'Anggaran Pendapatan dan Belanja Desa Kalajena untuk tahun 2024',
                file_size_mb: 2.5,
                download_count: 145,
                upload_by: 'Admin Desa',
                tanggal_upload: '15 Jan 2024'
            },
            {
                id: 2,
                nama_dokumen: 'RKPDes 2024-2029',
                tipe_dokumen: 'RKPDes',
                tahun: 2024,
                deskripsi: 'Rencana Kerja Pembangunan Desa 5 tahun',
                file_size_mb: 3.8,
                download_count: 98,
                upload_by: 'Admin Desa',
                tanggal_upload: '10 Jan 2024'
            },
            {
                id: 3,
                nama_dokumen: 'Peraturan Desa No. 1 Tahun 2024',
                tipe_dokumen: 'Peraturan Desa',
                tahun: 2024,
                deskripsi: 'Peraturan tentang pemberdayaan ekonomi masyarakat desa',
                file_size_mb: 1.2,
                download_count: 67,
                upload_by: 'Admin Desa',
                tanggal_upload: '05 Jan 2024'
            },
            {
                id: 4,
                nama_dokumen: 'Keputusan Desa No. 1 Tahun 2024',
                tipe_dokumen: 'Keputusan Desa',
                tahun: 2024,
                deskripsi: 'Penetapan Kepala Desa dan Perangkat Desa tahun 2024',
                file_size_mb: 0.8,
                download_count: 52,
                upload_by: 'Admin Desa',
                tanggal_upload: '03 Jan 2024'
            },
            {
                id: 5,
                nama_dokumen: 'Laporan Keuangan 2023',
                tipe_dokumen: 'Laporan Keuangan',
                tahun: 2023,
                deskripsi: 'Laporan pertanggungjawaban keuangan desa tahun 2023',
                file_size_mb: 4.2,
                download_count: 124,
                upload_by: 'Admin Desa',
                tanggal_upload: '15 Dec 2023'
            }
        ];
        
        // Fungsi untuk render dokumen
        function renderDokumen(dokumenList) {
            const container = document.getElementById('dokumenContainer');
            
            if (dokumenList.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="fas fa-file-excel"></i>
                        </div>
                        <p class="empty-state-text">Tidak ada dokumen yang sesuai dengan filter Anda</p>
                    </div>
                `;
                return;
            }
            
            let html = '<div class="dokumen-grid">';
            
            dokumenList.forEach(doc => {
                html += `
                    <div class="dokumen-card">
                        <div class="dokumen-header">
                            <div class="dokumen-icon">
                                <i class="fas fa-file-pdf"></i>
                            </div>
                            <span class="dokumen-type">${doc.tipe_dokumen}</span>
                        </div>
                        
                        <div class="dokumen-body">
                            <h5 class="dokumen-nama">${doc.nama_dokumen}</h5>
                            <span class="dokumen-tahun">${doc.tahun}</span>
                            
                            <p class="dokumen-deskripsi">${doc.deskripsi}</p>
                            
                            <div class="dokumen-stats">
                                <span><i class="fas fa-download"></i> ${doc.download_count} Downloads</span>
                                <span><i class="fas fa-file"></i> ${doc.file_size_mb} MB</span>
                            </div>
                            
                            <div class="dokumen-info">
                                <i class="fas fa-user"></i> Diupload oleh: ${doc.upload_by}<br>
                                <i class="fas fa-calendar"></i> ${doc.tanggal_upload}
                            </div>
                            
                            <div class="dokumen-actions">
                                <a href="#" class="btn-download" onclick="downloadDokumen(${doc.id})">
                                    <i class="fas fa-download"></i> Download
                                </a>
                                <a href="#" class="btn-preview">
                                    <i class="fas fa-eye"></i> Preview
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }
        
        // Fungsi filter dokumen
        function filterDokumen() {
            const tipe = document.getElementById('filterTipe').value;
            const tahun = document.getElementById('filterTahun').value;
            
            let filtered = dummyDokumen;
            
            if (tipe) {
                filtered = filtered.filter(doc => doc.tipe_dokumen === tipe);
            }
            
            if (tahun) {
                filtered = filtered.filter(doc => doc.tahun == tahun);
            }
            
            renderDokumen(filtered);
        }
        
        // Fungsi download
        function downloadDokumen(id) {
            const dokumen = dummyDokumen.find(d => d.id === id);
            if (dokumen) {
                console.log(`Download: ${dokumen.nama_dokumen}`);
                // Implementasi download di sini
                alert(`Mengunduh: ${dokumen.nama_dokumen}`);
            }
        }
        
        // Load awal
        document.addEventListener('DOMContentLoaded', () => {
            renderDokumen(dummyDokumen);
            
            // Event listener untuk filter
            document.getElementById('filterTipe').addEventListener('change', filterDokumen);
            document.getElementById('filterTahun').addEventListener('change', filterDokumen);
        });
    </script>
</body>
</html>
